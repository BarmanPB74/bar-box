name: APK Inventario Capiro

on:
  push:
    branches: [main]
    paths:
      - "inventario-capiro/**"
      - ".github/workflows/inventario-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Copiar la app web dentro del APK
        run: |
          mkdir -p inventario-capiro/android/app/src/main/assets
          cp inventario-capiro/index.html inventario-capiro/android/app/src/main/assets/index.html

      - name: Compilar APK firmado
        run: |
          set -o pipefail
          gradle -p inventario-capiro/android assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publicar versión
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: inventario-capiro-v0.1.${{ github.run_number }}
          name: Inventario Capiro 0.1.${{ github.run_number }}
          body: APK de prueba de Inventario Capiro. Instálalo en Android 8 o superior.
          files: inventario-capiro/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Dejar APK y bitácora en la rama apk
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp inventario-capiro/android/app/build/outputs/apk/debug/app-debug.apk out/inventario-capiro.apk 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA}" > out/estado.txt
          cd out
          git init -q && git checkout -q -b apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
