<title>Inventario Capiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: una sola columna tipo app de bolsillo, barra inferior fija. Identidad EK: negro y crema, sin acentos de color salvo alertas */
:root{
  --bg:#f3f1eb; --surface:#fbfaf6; --ink:#0b0b0a; --muted:#6a675f; --line:#dedbd2;
  --brand:#0b0b0a; --leaf:#0b0b0a; --leaf-soft:#e6e3da;
  --warn:#8a5a0e; --warn-soft:#f6ecd8; --bad:#a3322a; --bad-soft:#f6dfdb;
  --f-display:"Archivo", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, "Roboto Mono", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0a; --surface:#161614; --ink:#ece8dd; --muted:#9b978c; --line:#2b2a26;
  --brand:#ece8dd; --leaf:#ece8dd; --leaf-soft:#24231f;
  --warn:#e0b25f; --warn-soft:#2e2615; --bad:#ec8a7e; --bad-soft:#35191a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0a; --surface:#161614; --ink:#ece8dd; --muted:#9b978c; --line:#2b2a26;
  --brand:#ece8dd; --leaf:#ece8dd; --leaf-soft:#24231f;
  --warn:#e0b25f; --warn-soft:#2e2615; --bad:#ec8a7e; --bad-soft:#35191a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;padding:0 16px 96px}
.wrap{max-width:640px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.25rem;color:var(--brand);letter-spacing:-.01em}
.logo{width:40px;height:40px;border-radius:10px;background:#0b0b0a;display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--line)}
.logo svg{width:28px;height:22px;fill:#ece8dd}
.brand small{display:block;margin-top:1px;font-family:var(--f-body);font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mode{font-size:.75rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mode.on{color:var(--leaf);border-color:var(--leaf)}
.mode.local{color:var(--warn);border-color:var(--warn)}
h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:20px 0 8px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1rem;margin:16px 0 6px}
.lbl{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mission{background:var(--brand);color:var(--bg);border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.mission .lbl{color:inherit;opacity:.75}
.mission b{font-family:var(--f-display);font-size:1.1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat .n{font-family:var(--f-num);font-size:1.15rem;font-variant-numeric:tabular-nums}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-top:8px}
.alert .dot{width:10px;height:10px;border-radius:50%}
.alert.bad{background:var(--bad-soft);border-color:transparent}.alert.bad .dot{background:var(--bad)}
.alert.warn{background:var(--warn-soft);border-color:transparent}.alert.warn .dot{background:var(--warn)}
.alert.ok .dot{background:var(--leaf)}
.alert .t{min-width:0}.alert .t div{font-size:.85rem;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font:inherit;width:100%}
.row:first-child{border-top:0}
.row .nm{font-weight:600;min-width:0}
.row .sub{font-size:.8rem;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf)}
.pill{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.pill.p{background:var(--leaf-soft);color:var(--leaf)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mut{border:1px solid var(--line);color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:8px 0;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 .85rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--bg);border-color:var(--brand)}
label.f{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{border:0;border-radius:9px;padding:8px 2px;font:700 .8rem var(--f-body);background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.qty{display:grid;grid-template-columns:48px 1fr 48px;gap:6px}
.qty button{font:700 1.2rem var(--f-num)}
.btn{border:0;border-radius:12px;padding:12px 16px;font:700 1rem var(--f-body);cursor:pointer;background:var(--leaf);color:var(--bg)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:.85rem;color:var(--muted)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{border:0;background:none;color:var(--muted);font:700 .72rem var(--f-body);display:grid;justify-items:center;gap:2px;padding:4px 0;cursor:pointer}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--leaf)}
.ct{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.ct .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ct .ins{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ct .ins input{padding:8px;text-align:center;font-family:var(--f-num)}
.ct .ins label{font-size:.7rem}
.ct .res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.8rem}
.ct .res div{background:var(--bg);border-radius:8px;padding:6px;display:grid}
.ct .res b{font-family:var(--f-num);font-size:.95rem}
.neg{color:var(--bad)}.pos{color:var(--warn)}.zero{color:var(--leaf)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,6,4,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:90%}
table.rep{border-collapse:collapse;width:100%;font-size:.85rem}
table.rep th,table.rep td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.rep th:first-child,table.rep td:first-child{text-align:left;white-space:normal}
.scroll{overflow-x:auto}
.guide ol{padding-left:20px;margin:6px 0}.guide li{margin:4px 0}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

/* ---------- Almacenamiento: db compartida o modo local ---------- */
const LKEY="capiro-inventario-v1";
let chain=Promise.resolve();
function enqueue(fn){chain=chain.then(fn).catch(e=>{console.error(e);toast(e&&e.code==="quota_exceeded"?"Base llena: exporta y limpia movimientos antiguos.":"No se pudo guardar. Revisa la conexión e intenta de nuevo.");});return chain;}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({prod:S.prod,days:S.days,cuadres:S.cuadres}));}catch(e){}}
function loadLocal(){let d=null;try{d=JSON.parse(localStorage.getItem(LKEY)||"null");}catch(e){}
  if(d){S.prod=d.prod||{};S.days=d.days||{};S.cuadres=d.cuadres||{};}
  else{S.prod=JSON.parse(JSON.stringify(CATALOGO));saveLocal();S.firstRun=true;}}
const store={
  putProd(id,data){S.prod[id]=data;if(S.backend)return enqueue(()=>S.backend.collection("productos").doc(id).set(data));saveLocal();render();},
  delProd(id){delete S.prod[id];if(S.backend)return enqueue(()=>S.backend.collection("productos").doc(id).delete());saveLocal();render();},
  putDay(date,items){S.days[date]={items};if(S.backend)return enqueue(()=>S.backend.collection("dias").doc(date).set({items}));saveLocal();render();},
  putCuadre(id,data){S.cuadres[id]=data;if(S.backend)return enqueue(()=>S.backend.collection("cuadres").doc(id).set(data));saveLocal();render();},
  delCuadre(id){delete S.cuadres[id];if(S.backend)return enqueue(()=>S.backend.collection("cuadres").doc(id).delete());saveLocal();render();}
};
function setMode(kind,text){const m=$("#mode");m.className="mode "+kind;m.textContent=text;}
function snapToMap(snap){const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});return o;}
async function connect(){
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null;}catch(e){db=null;}
  if(!db){loadLocal();setMode("local",window.AndroidApp?"En este teléfono":"Solo este navegador");S.ready=true;render();if(S.firstRun)toast("Catálogo del libro maestro cargado: 91 productos");return;}
  S.backend=db;setMode("on","Sincronizado");
  try{const u=window.claude&&window.claude.use?await window.claude.use("user"):null;if(u){const c=await u.can("data.write");if(c===false)S.canWrite=false;}}catch(e){}
  const loaded={p:false,d:false,c:false};
  const onErr=e=>{setMode("local","Sin conexión");console.error(e);};
  db.collection("productos").onSnapshot(s=>{S.prod=snapToMap(s);loaded.p=true;maybe();},onErr);
  db.collection("dias").onSnapshot(s=>{S.days=snapToMap(s);loaded.d=true;maybe();},onErr);
  db.collection("cuadres").onSnapshot(s=>{S.cuadres=snapToMap(s);loaded.c=true;maybe();},onErr);
  function maybe(){if(loaded.p&&loaded.d&&loaded.c){S.ready=true;softRender();}}
}
function softRender(){const a=document.activeElement;if(a&&$("#main").contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)){S.pendingRender=true;return;}render();}
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.pendingRender){S.pendingRender=false;softRender();}},150));

/* ---------- Cálculos ---------- */
function allMovs(){const out=[];Object.keys(S.days).forEach(k=>{(S.days[k].items||[]).forEach(m=>out.push(Object.assign({day:k},m)));});return out.sort((a,b)=>a.ts-b.ts);}
function cuadreList(){return Object.keys(S.cuadres).map(id=>Object.assign({id},S.cuadres[id])).sort((a,b)=>b.ts-a.ts);}
function lastCount(pid){for(const c of cuadreList()){const r=(c.filas||[]).find(f=>f.p===pid&&f.fisico!==null&&f.fisico!==undefined&&f.fisico!=="");if(r)return{ts:c.ts,fisico:Number(r.fisico),id:c.id};}return null;}
function sign(m){const q=Number(m.q)||0;if(m.t==="entrada")return q;if(m.t==="ajuste")return q;return -q;}
function flow(pid,movs){const lc=lastCount(pid);const since=lc?lc.ts:0;const f={base:lc?lc.fisico:0,since,counted:!!lc,ent:0,merma:0,consumo:0,venta:0,ajuste:0};
  for(const m of movs){if(m.p!==pid||m.ts<=since)continue;const q=Number(m.q)||0;if(m.t==="entrada")f.ent+=q;else if(m.t==="merma")f.merma+=q;else if(m.t==="consumo")f.consumo+=q;else if(m.t==="venta")f.venta+=q;else if(m.t==="ajuste")f.ajuste+=q;}
  f.stock=f.base+f.ent+f.ajuste-f.merma-f.consumo-f.venta;return f;}
function lots(pid,movs,stock){const ent=movs.filter(m=>m.p===pid&&m.t==="entrada").sort((a,b)=>{const av=a.vence||"9999",bv=b.vence||"9999";return av<bv?1:av>bv?-1:b.ts-a.ts;});
  let rem=Math.max(0,stock);const out=[];for(const e of ent){if(rem<=0)break;const take=Math.min(rem,Number(e.q)||0);rem-=take;out.push({lote:e.lote,vence:e.vence,q:take,ts:e.ts});}
  return out.sort((a,b)=>(a.vence||"9999")<(b.vence||"9999")?-1:1);}
function computeAll(){const movs=allMovs();const res={};Object.keys(S.prod).forEach(id=>{const p=S.prod[id];if(p.activo===false)return;const f=flow(id,movs);f.lots=p.per?lots(id,movs,f.stock):[];res[id]=f;});return{movs,res};}

  h+='<h2>Pedido sugerido</h2>';

function calcRow(f,d){const fis=d.fisico===undefined||d.fisico===""?null:Number(d.fisico);
  const salio=fis===null?null:f.base+f.ent+f.ajuste-f.merma-f.consumo-fis;
  const lv=d.lventas===undefined||d.lventas===""?null:Number(d.lventas);
  const ls=d.lstock===undefined||d.lstock===""?null:Number(d.lstock);
  return{fis,salio,difV:(salio!==null&&lv!==null)?salio-lv:null,difS:(fis!==null&&ls!==null)?ls-fis:null,difApp:fis!==null?fis-f.stock:null};}
function cls(n){return n===null?"":Math.abs(n)<1e-9?"zero":n<0?"neg":"pos";}
function resCells(id,f,d){const r=calcRow(f,d);const v=n=>n===null?"—":(n>0?"+":"")+fmt(n);
  return'<div>Salió (calculado)<b>'+(r.salio===null?"—":fmt(r.salio))+'</b></div><div>Ventas sin registrar<b class="'+cls(r.difV)+'">'+v(r.difV)+'</b></div><div>Error stock Loggro<b class="'+cls(r.difS)+'">'+v(r.difS)+'</b></div>';}
function cuadreSummary(c){let valor=0,faltVentas=0;(c.filas||[]).forEach(r=>{const cost=Number((S.prod[r.p]||{}).costo)||0;if(typeof r.difApp==="number")valor+=r.difApp*cost;if(typeof r.difV==="number"&&r.difV>0)faltVentas+=r.difV;});return{valor,faltVentas};}

  openSheet('<h2>Cuadre '+ftime(c.ts)+'</h2><p class="hint">'+esc(c.nota||"")+'</p><div class="stats"><div class="stat"><div class="lbl">Productos</div><div class="n">'+rows.length+'</div></div><div class="stat"><div class="lbl">Ventas sin registrar</div><div class="n">'+fmt(r.faltVentas)+'</div></div><div class="stat"><div class="lbl">Dif. valorizada</div><div class="n">'+cop(r.valor)+'</div></div></div>'+
  '<div class="scroll" style="margin-top:12px"><table class="rep"><thead><tr><th>Producto</th><th>Esperado</th><th>Físico</th><th>Salió</th><th>Ventas Loggro</th><th>Sin registrar</th><th>Stock Loggro</th><th>Error Loggro</th></tr></thead><tbody>'+
  rows.map(x=>'<tr><td>'+esc(prodName(x.p))+'</td><td class="num">'+fmt(x.esperado)+'</td><td class="num">'+fmt(x.fisico)+'</td><td class="num">'+(x.salio==null?"—":fmt(x.salio))+'</td><td class="num">'+(x.lventas==null?"—":fmt(x.lventas))+'</td><td class="num '+cls(x.difV??null)+'">'+(x.difV==null?"—":fmt(x.difV))+'</td><td class="num">'+(x.lstock==null?"—":fmt(x.lstock))+'</td><td class="num '+cls(x.difS??null)+'">'+(x.difS==null?"—":fmt(x.difS))+'</td></tr>').join("")+
  '</tbody></table></div><div class="btns" style="margin-top:12px"><button class="btn" id="cExp">Exportar CSV</button><button class="btn sec" id="cClose">Cerrar</button><button class="btn danger" id="cDel">Borrar</button></div><div id="cConf"></div>');
  $("#cClose").onclick=closeSheet;
  $("#cExp").onclick=()=>exportCSV("cuadre-"+id+".csv",[["Producto","Código","Esperado app","Físico","Salió calculado","Ventas Loggro","Ventas sin registrar","Stock Loggro","Error stock Loggro","Costo"]].concat(rows.map(x=>[prodName(x.p),x.p,x.esperado,x.fisico,x.salio,x.lventas,x.difV,x.lstock,x.difS,(S.prod[x.p]||{}).costo||0])));
  $("#cDel").onclick=()=>{$("#cConf").innerHTML='<p class="hint">Borrar este cuadre cambia el punto de partida de sus productos.</p><button class="btn danger" id="cDelOk">Sí, borrar</button>';$("#cDelOk").onclick=()=>{store.delCuadre(id);closeSheet();toast("Cuadre borrado");};};
}
function exportCSV(name,rows){const csv="\ufeff"+rows.map(r=>r.map(v=>{v=v==null?"":String(v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\n");return saveFile(name,csv,"text/csv");}
async function saveFile(name,text,mime){
  if(window.AndroidApp&&window.AndroidApp.saveFile){try{const r=window.AndroidApp.saveFile(name,text,mime);if(r==="ok"){toast("Guardado en Descargas: "+name);return;}}catch(e){}}
  try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;if(dl){await dl.save({filename:name,data:text});toast("Archivo listo");return;}}catch(e){if(e&&e.code==="declined")return;}
  openSheet('<h2>Copiar contenido</h2><p class="hint">No se pudo guardar el archivo aquí. Copia el texto y guárdalo o pégalo en una hoja de cálculo.</p><textarea id="csvT" rows="10" readonly>'+esc(text.replace(/^\ufeff/,""))+'</textarea><div class="btns" style="margin-top:8px"><button class="btn" id="csvC">Copiar</button><button class="btn sec" id="csvX">Cerrar</button></div>');
  $("#csvX").onclick=closeSheet;$("#csvC").onclick=()=>{const t=$("#csvT");navigator.clipboard.writeText(t.value).then(()=>toast("Copiado")).catch(()=>{t.select();toast("Texto seleccionado: cópialo");});};
}

function openRestore(){
  openSheet('<h2>Restaurar copia</h2><p class="hint">Elige el archivo de respaldo o pega su contenido. Reemplaza todo lo que hay ahora en esta app.</p><div class="form"><label class="f" for="rkFile">Archivo .json<input id="rkFile" type="file" accept=".json,application/json"></label><label class="f" for="rkTxt">O pega el contenido<textarea id="rkTxt" rows="5"></textarea></label><div class="btns"><button class="btn" id="rkGo">Revisar copia</button><button class="btn sec" id="rkX">Cancelar</button></div><div id="rkMsg"></div></div>');
  $("#rkX").onclick=closeSheet;
  $("#rkFile").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("#rkTxt").value=r.result;};r.readAsText(f);};
  $("#rkGo").onclick=()=>{let d;try{d=JSON.parse($("#rkTxt").value);}catch(e){$("#rkMsg").innerHTML='<p class="hint neg">El contenido no es una copia válida.</p>';return;}
    if(!d||d.app!=="inventario-capiro"){$("#rkMsg").innerHTML='<p class="hint neg">Este archivo no es una copia de Inventario Capiro.</p>';return;}
    const np=Object.keys(d.prod||{}).length,nd=Object.keys(d.days||{}).length,nc=Object.keys(d.cuadres||{}).length;
    $("#rkMsg").innerHTML='<p class="hint">Copia del '+esc(String(d.fecha||"").slice(0,10))+': '+np+' productos, '+nd+' días con movimientos, '+nc+' cuadres.</p><button class="btn danger" id="rkOk">Reemplazar mis datos</button>';
    $("#rkOk").onclick=()=>{
      if(S.backend){Object.keys(d.prod||{}).forEach(k=>store.putProd(k,d.prod[k]));Object.keys(d.days||{}).forEach(k=>store.putDay(k,(d.days[k]||{}).items||[]));Object.keys(d.cuadres||{}).forEach(k=>store.putCuadre(k,d.cuadres[k]));}
      else{S.prod=d.prod||{};S.days=d.days||{};S.cuadres=d.cuadres||{};saveLocal();}
      closeSheet();toast("Copia restaurada");render();};};
}
/* ---------- Eventos ---------- */
function bind(){
  const main=$("#main");
  main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.view=b.dataset.go;render();});
  if(S.view==="mover"){const M=S.mov;
    main.querySelectorAll("[data-tipo]").forEach(b=>b.onclick=()=>{M.t=b.dataset.tipo;render();});
    $("#mFiltro").oninput=e=>{M.filtro=e.target.value;$("#mProd").innerHTML=optionsFor(M.filtro);};
    $("#mProd").onchange=e=>{M.p=e.target.value;render();};
    $("#mQty").oninput=e=>{M.qty=e.target.value;};
    main.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const v=(Number(M.qty)||0)+Number(b.dataset.q);M.qty=M.t==="ajuste"?v:Math.max(0,v);$("#mQty").value=M.qty;});
    [["mLote","lote"],["mVence","vence"],["mCosto","costo"],["mNota","nota"],["mMotivo","motivo"]].forEach(([i,k])=>{const el=$("#"+i);if(el)el.oninput=el.onchange=e=>{M[k]=e.target.value;};});
    $("#mSave").onclick=()=>{const q=Number(M.qty);if(!M.p){toast("Elige un producto.");return;}if(!q||(M.t!=="ajuste"&&q<0)){toast("La cantidad debe ser mayor que cero.");return;}
      const mv={id:rid(),p:M.p,t:M.t,q,ts:Date.now()};if(M.t==="entrada"){if(M.lote)mv.lote=M.lote.trim();if(M.vence)mv.vence=M.vence;}if(M.t==="merma")mv.motivo=M.motivo;if(M.nota.trim())mv.nota=M.nota.trim();
      const d=today();const items=((S.days[d]||{}).items||[]).concat([mv]);store.putDay(d,items);
      if(M.t==="entrada"&&Number(M.costo)>0&&S.prod[M.p])store.putProd(M.p,Object.assign({},S.prod[M.p],{costo:Number(M.costo)}));
      toast(TIPOS[M.t]+" guardada: "+fmt(q)+" · "+prodName(M.p));Object.assign(M,{qty:1,lote:"",vence:"",costo:"",nota:""});render();};
    main.querySelectorAll("[data-delmov]").forEach(b=>b.onclick=()=>{if(b.dataset.armed){const d=today();store.putDay(d,((S.days[d]||{}).items||[]).filter(x=>x.id!==b.dataset.delmov));toast("Movimiento borrado");}else{b.dataset.armed="1";b.textContent="¿Seguro?";b.style.color="var(--bad)";}});
  }
  if(S.view==="stock"){
    $("#sQ").oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#sQ");n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}
    main.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;render();});
    main.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));
    $("#addP").onclick=()=>editProduct(null);
  }
  if(S.view==="cuadre"){
    main.querySelectorAll("[data-ccat]").forEach(b=>b.onclick=()=>{S.ccat=b.dataset.ccat;render();});
    main.querySelectorAll("[data-row]").forEach(row=>{const id=row.dataset.row;row.querySelectorAll("input[data-k]").forEach(inp=>inp.oninput=()=>{S.draft[id]=S.draft[id]||{};S.draft[id][inp.dataset.k]=inp.value;
      const {res}=computeAll();row.querySelector("[data-res]").innerHTML=resCells(id,res[id],S.draft[id]);
      const n=Object.keys(S.draft).filter(k=>S.draft[k].fisico!==undefined&&S.draft[k].fisico!=="").length;const b=$("#cSave");b.disabled=!n||!S.canWrite;b.textContent="Guardar cuadre ("+n+" productos)";});});
    $("#cSave").onclick=()=>{const {res}=computeAll();const filas=[];
      Object.keys(S.draft).forEach(id=>{const d=S.draft[id],f=res[id];if(!f||d.fisico===undefined||d.fisico==="")return;const r=calcRow(f,d);
        filas.push({p:id,esperado:Math.round(f.stock*100)/100,fisico:r.fis,salio:r.salio,lventas:d.lventas===""||d.lventas===undefined?null:Number(d.lventas),lstock:d.lstock===""||d.lstock===undefined?null:Number(d.lstock),difV:r.difV,difS:r.difS,difApp:r.difApp});});
      if(!filas.length)return;const id="c"+Date.now();store.putCuadre(id,{ts:Date.now(),fecha:today(),nota:$("#cNota").value.trim(),filas});S.draft={};toast("Cuadre guardado: "+filas.length+" productos");render();};
    main.querySelectorAll("[data-cuadre]").forEach(b=>b.onclick=()=>showCuadre(b.dataset.cuadre));
  }
  if(S.view==="mas"){
    $("#bkExp").onclick=()=>saveFile("respaldo-inventario-capiro-"+today()+".json",JSON.stringify({app:"inventario-capiro",version:1,fecha:new Date().toISOString(),prod:S.prod,days:S.days,cuadres:S.cuadres}),"application/json");
    $("#bkImp").onclick=openRestore;
    $("#xStock").onclick=()=>{const {res}=computeAll();exportCSV("stock-capiro-"+today()+".csv",[["Código","Producto","Categoría","Unidad","Stock app","Mínimo","Ideal","Costo","Valor","Último conteo"]].concat(Object.keys(res).sort().map(id=>{const p=S.prod[id],f=res[id];return[id,p.nombre,p.cat,p.unidad,f.stock,p.min,p.ideal,p.costo,Math.max(0,f.stock)*(Number(p.costo)||0),f.counted?ftime(f.since):""];})));};
    $("#xMov").onclick=()=>exportCSV("movimientos-capiro-"+today()+".csv",[["Fecha","Código","Producto","Tipo","Cantidad","Lote","Vence","Motivo","Nota"]].concat(allMovs().map(m=>[ftime(m.ts),m.p,prodName(m.p),TIPOS[m.t],sign(m),m.lote||"",m.vence||"",m.motivo||"",m.nota||""])));
  }
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;closeSheet();render();window.scrollTo(0,0);});
render();connect();
})();
</script>
